<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body>
    <nav>
      <div>Pulse</div>
      <div>
        <ul>
          <li><a href="index.html" target="_self">Home</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </div>
    </nav>

    <form action="#" method="post">
      <h2>Create an account</h2>
      <p>Join the Pulse network</p>
      <div><button>Donor</button><button>Hospital</button></div>
      <div>
        <label for="fullname">Full Name</label><br /><input
          type="text"
          placeholder="John Doe"
        />
      </div>
      <div>
        <label for="email">Email</label><br /><input
          type="email"
          placeholder="john@example.com"
        />
      </div>
      <div>
        <label for="password">Password</label><br /><input type="password" />
      </div>
      <div>
        <label for="blood-group">Select Blood Group</label>&nbsp;<select
          name="blood_group"
          id=""
        >
          <option value="a_positive">A+</option>
          <option value="a_negative">A-</option>
          <option value="ab">AB</option>
          <option value="b_positive">B+</option>
          <option value="b_negative">B-</option>
          <option value="o_positive">O+</option>
          <option value="o_negative">O-</option>
        </select>
      </div>
      <div><label for="phone">Phone</label><br /><input type="tel" /></div>
      <div>
        <label for="location">Location</label><br /><input type="text" />
      </div>
      <div>
        <label for="date-of-birth">Date of Birth</label><br /><input
          type="date"
        />
      </div>
      <button>Create Account</button>
      <div><label for="have-an-account">Already have an account?</label>&nbsp;<a href="login.html" target="_self">Login</a></div>
    </form>
  </body>
</html>
